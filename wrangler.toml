# Modify name if deploying multiple instances
name = "sub-box"

main = ".open-next/worker.js"

compatibility_date = "2024-09-26"
compatibility_flags = ["nodejs_compat"]

minify = true

assets = { directory = ".open-next/assets", binding = "ASSETS" }

# [placement]
# mode = "smart"

# Environment variables
# Modify these to use the correct environment variables
[vars]
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "N1gh7f@ll99!" # Change this to a secure password
JWT_SECRET = "q18Ssl1HuV5HNaoQnly1TJVhhimlObOsve5imfw4FHQ=" # Change this to a secure secret key
SESSION_TAG = "0"
SESSION_DURATION = "7d"
DEPLOY_TARGET = "cloudflare"

[[d1_databases]]
binding = "DB"
database_name = "subhome" # Change this to the name of your D1 database
database_id = "5f97046c-574c-40b2-b174-0da960786d03" # wrangler d1 info <YOUR_DATABASE_NAME>

[observability.logs]
enabled = true

